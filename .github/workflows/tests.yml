name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (battle logic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run tests
        run: python -m pytest tests/ -v
